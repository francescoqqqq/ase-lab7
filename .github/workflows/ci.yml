name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      # 1. Scarica il codice del repo
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Prepara Node 22
      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # 3. Installa la CLI di Bruno 
      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli@4.3.0

      # 4. Accendi calc e il suo stub
      - name: Start calc and stub
        run: docker compose -f compose.calc.yaml up --build -d --wait

      # 5. Lancia i test Bruno da tests/bruno con environment calc-component
      - name: Component tests of calc
        working-directory: tests/bruno
        run: |
          bru run calc calc-stub --env calc-component

      # 6. Spegni lo stack in ogni caso (anche se i test falliscono)
      - name: Stop calc and stub
        if: always()
        run: docker compose -f compose.calc.yaml down

      # 7. Accendi string e il suo stub
      - name: Start string and stub
        run: docker compose -f compose.string.yaml up --build -d --wait

      # 8. Lancia i test Bruno da tests/bruno con environment string-component
      - name: Component tests of string
        working-directory: tests/bruno
        run: |
          bru run string string-stub --env string-component

      # 9. Spegni lo stack in ogni caso (anche se i test falliscono)
      - name: Stop string and stub
        if: always()
        run: docker compose -f compose.string.yaml down

      # 10. Accendi tutta l'app
      - name: Start application
        run: docker compose up --build -d --wait

      # 11. Lancia i test Bruno da tests/bruno su calc string con integration
      - name: Integration tests
        working-directory: tests/bruno
        run: |
          bru run string calc --env integration

      # 12. scrivi log se qualcosa fallisce
      - name: log fallimento
        if: failure()
        run: |
          docker compose logs

      # 13. Spegni lo stack in ogni caso (anche se i test falliscono)
      - name: Stop application
        if: always()
        run: docker compose down